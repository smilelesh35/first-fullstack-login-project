<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background: linear-gradient(135deg, #1e1e2f, #2c3e50);
            color:white;
        }

        /* NAVBAR */
        .navbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 50px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            position: sticky;
            top:0;
        }

        .logo{
            font-size:22px;
            font-weight:bold;
            color:#00d4ff;
        }

        .nav-links{
            display:flex;
            gap:25px;
        }

        .nav-links a{
            text-decoration:none;
            color:white;
            transition:0.3s;
        }

        .nav-links a:hover{
            color:#00d4ff;
        }

        .btn{
            padding:8px 15px;
            background:#00d4ff;
            border:none;
            border-radius:6px;
            cursor:pointer;
            color:black;
            font-weight:bold;
        }

        /* FORM WRAPPER */
        .login-wrapper{
            height:90vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-box{
            width:380px;
            background: rgba(255,255,255,0.1);
            padding:30px;
            border-radius:12px;
            backdrop-filter: blur(10px);
            box-shadow:0 0 20px rgba(0,0,0,0.3);
        }

        .signup-form h2{
            text-align:center;
            margin-bottom:20px;
            color:#00d4ff;
        }

        .signup-form input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:none;
            border-radius:8px;
            outline:none;
        }

        .signup-form button{
            width:100%;
            padding:12px;
            margin-top:15px;
            background:#00d4ff;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
        }

        .signup-form button:hover{
            opacity:0.8;
        }

        .small-text{
            text-align:center;
            margin-top:15px;
            font-size:14px;
            opacity:0.7;
        }
        .register{
            margin-left: 5px;

        }
        .register a{
            color:#fff;
        }


    </style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">ZaferApp</div>
    <div class="nav-links">
        <a href="index.html">Ana Sayfa</a>
        <a href="login.html">Giriş Yap</a>
        <a href="#">Hakkında</a>
        <a href="#">İletişim</a>
    </div>
    <button class="btn">Login</button>
</div>

<!-- SIGNUP -->
<div class="login-wrapper">
    <div class="login-box">
        <form class="signup-form">
            <h2>Kayıt Ol</h2>
            <input type="text" class="name" placeholder="Kullanıcı Adı" required>
            <input type="number" class="userNo" placeholder="User No" required>
            <input type="password" class="password" placeholder="Şifre" required>
            <button type="submit">Sign Up</button>
        </form>
        <div class="small-text">Hesabın var mı?<span class="register"><a href="#">Giriş yap</a></span></div>
    </div>
</div>



<script type="module">


    const form = document.querySelector('.signup-form');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.querySelector('.name').value;
        const userNo = document.querySelector('.userNo').value;
        const password = document.querySelector('.password').value;


        try {

           const response  =await fetch("http://localhost:3000/signup", {
               method: "POST",
               headers: {
                   "Content-Type": "application/json",
               },
               body: JSON.stringify({
                   name : name,
                   user_no : userNo,
                   password: password,
               })
           })
                const data  = await response.json();
            if(!response.ok){
                console.log(data.message);
                alert("Kayıt başarısız");
                return;
            }else{
            window.location.href = "anasayfa.html";
            localStorage.setItem("token", data.token);
            alert("Kayıt başarılı yönlendiriliyorsunuz...");
            }

        } catch (err) {
            console.log(err)
        }


    })



const registerForm = document.querySelector('.register')
    registerForm.addEventListener('click',  (e) => {
        e.preventDefault();
        window.location.href = "login.html";
    })
    const btn = document.querySelector('.btn')
    btn.addEventListener('click', (e) => {
        e.preventDefault()
        window.location.href = "login.html";
    })

</script>
</body>
</html>
